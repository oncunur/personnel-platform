name: migration-contracts

on:
  pull_request:
    paths:
      - 'docs/migration/**'
      - 'scripts/migration/**'
      - '.github/workflows/migration-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate migration contract schema
        run: python scripts/migration/validate-contracts.py
