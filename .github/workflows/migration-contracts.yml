name: migration-contracts

on:
  pull_request:
    paths:
      - 'docs/migration/**'
      - 'scripts/migration/**'
      - '.github/workflows/migration-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate migration contract schema
        run: python scripts/migration/validate-contracts.py
      - name: Validate canonical target field catalog
        run: python scripts/migration/validate_target_catalog.py
      - name: Test migration transformations
        working-directory: scripts/migration
        run: python -m unittest -v test_transform_values.py
      - name: Run synthetic migration dry-run
        run: >-
          python scripts/migration/preview_transform.py
          --source scripts/migration/fixtures/legacy-employees.csv
          --mapping scripts/migration/fixtures/employee-field-mapping.csv
          --source-system SYNTHETIC_HR
          --source-object EMPLOYEE_EXPORT
          --max-rows 10
