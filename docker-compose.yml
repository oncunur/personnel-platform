name: personnel-platform

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personnel_platform}
      POSTGRES_USER: ${POSTGRES_USER:-personnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personnel_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personnel} -d ${POSTGRES_DB:-personnel_platform}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.2.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-personnel_platform};Username=${POSTGRES_USER:-personnel};Password=${POSTGRES_PASSWORD:-personnel_dev_only};Include Error Detail=true
      Redis__Host: redis
      Redis__Port: 6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-at-least-32-bytes-long}
      Security__DataProtectionKey: ${SECURITY_DATA_PROTECTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      FileStorage__RootPath: /app/storage
      BootstrapAdmin__Username: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123!ChangeMe}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-admin@local.test}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-personnel_platform};Username=${POSTGRES_USER:-personnel};Password=${POSTGRES_PASSWORD:-personnel_dev_only};Include Error Detail=true
      Redis__Host: redis
      Redis__Port: 6379
      Security__DataProtectionKey: ${SECURITY_DATA_PROTECTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      FileStorage__RootPath: /app/storage
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  file_storage:
